// Native HiDPI & Aspect-Ratio Preserving Viewport (Zero Stretching / Crystal Clear)
let viewScale = 1, viewOffX = 0, viewOffY = 0, viewDpr = 1;
function resizeCanvasHiDPI() {
  viewDpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;
  canvas.width = Math.round(cssW * viewDpr);
  canvas.height = Math.round(cssH * viewDpr);
  viewScale = Math.min(cssW / W, cssH / H);
  viewOffX = (cssW - W * viewScale) * 0.5;
  viewOffY = (cssH - H * viewScale) * 0.5;
}
window.addEventListener('resize', resizeCanvasHiDPI);
resizeCanvasHiDPI();

// Convert client mouse coordinates to 1280x720 virtual canvas coordinates accurately
let mouseX = -1, mouseY = -1;
function updateMousePos(e) {
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left - viewOffX) / viewScale;
  mouseY = (e.clientY - r.top - viewOffY) / viewScale;
}
canvas.addEventListener('mousemove', updateMousePos);

function isImgReady(key) {

//  4. TRACK & ROAD SEGMENTS GENERATOR (CURVES, HILLS & SCENERY)
// ============================================================================
const SEG_LEN = 200;
const ROAD_WIDTH = 2000;
let trackSegments = [];
let totalTrackZ = 48000;

function buildTrack(themeId) {
  trackSegments = [];
  const N = 320;
  for (let i = 0; i < N; i++) {
    let curve = 0;
    let elev = 0;
    const t = i / N;
    if (themeId === 0) {
      curve = Math.sin(t * Math.PI * 6) * 1.6 + Math.cos(t * Math.PI * 10) * 0.7;
      elev = Math.sin(t * Math.PI * 8) * 1400 + Math.cos(t * Math.PI * 16) * 450;
    } else if (themeId === 1) {
      curve = Math.sin(t * Math.PI * 8) * 2.3;
      elev = Math.sin(t * Math.PI * 10) * 2600 + Math.sin(t * Math.PI * 22) * 800;
    } else if (themeId === 2) {
      curve = Math.sin(t * Math.PI * 5) * 1.4;
      elev = Math.sin(t * Math.PI * 6) * 750;
    } else {
      curve = Math.sin(t * Math.PI * 7) * 1.9;
      elev = Math.sin(t * Math.PI * 12) * 1950 + Math.cos(t * Math.PI * 20) * 650;
    }
    const bank = -curve * 0.06;
    trackSegments.push({
      index: i,
      z: i * SEG_LEN,
      curve,
      elevation: elev,
      roadBank: bank,
      isRed: (i % 2 === 0),
      sceneryLeft: (i % 7 === 0) ? "tree" : ((i % 19 === 0) ? "rock" : null),
      sceneryRight: (i % 6 === 0) ? "tree" : ((i % 23 === 0) ? "arch" : null),
      gantry: (i > 10 && i % 45 === 0)
    });
  }
  const lenScale = DIFFICULTIES[menuState.difficulty].lenScale;
  totalTrackZ = Math.floor(N * SEG_LEN * lenScale);
}

const mpState = {

  connected: false,
  isHost: false,

function ensureWebSocket() {
  if (mpState.ws && (mpState.ws.readyState === WebSocket.OPEN || mpState.ws.readyState === WebSocket.CONNECTING)) {
    return mpState.ws;
  }
  const proto = (location.protocol === 'https:') ? 'wss:' : 'ws:';
  const wsUrl = `${proto}//${location.host}/ws`;
  const ws = new WebSocket(wsUrl);
  mpState.ws = ws;

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "WS_SUBSCRIBE_LOBBY" }));
  };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    const t = msg.type;
    if (t === "WS_ROOM_LIST") {
      mpState.discoveredRooms = msg.rooms || [];
    } else if (t === "WS_HOST_OK") {
      mpState.connected = true;
      mpState.isHost = true;
      mpState.myPeerId = 0;
      mpState.roomId = msg.roomId;
      mpState.ready = true;
      mpState.peers = {};
      mpState.statusText = `HOSTING ROOM [${msg.roomId}]`;
    } else if (t === "WS_AUTH_FAILED") {
      mpState.errorText = msg.reason || "Unable to join room";
      mpState.errorTimer = 5.0;
    } else if (t === "WS_WELCOME") {
      mpState.connected = true;
      mpState.isHost = false;
      mpState.myPeerId = msg.assignedId || 1;
      mpState.roomId = msg.roomId;
      mpState.ready = false;
      mpState.peers = {};
      (msg.roster || []).forEach(p => {
        if (p.id !== mpState.myPeerId) {
          mpState.peers[p.id] = { id: p.id, name: p.name, car: p.car || 0, ready: !!p.ready, worldZ: 0, x: -0.25, speed: 0 };
        }
      });
      if (typeof msg.theme === 'number') menuState.theme = msg.theme;
      if (typeof msg.tod === 'number') menuState.tod = msg.tod;
    } else if (t === "WS_PEER_JOINED") {
      if (msg.id !== mpState.myPeerId) {
        mpState.peers[msg.id] = { id: msg.id, name: msg.name, car: msg.car || 0, ready: false, worldZ: 0, x: -0.25, speed: 0 };
      }
    } else if (t === "WS_PEER_LEFT") {
      delete mpState.peers[msg.id];
    } else if (t === "WS_READY") {
      if (mpState.peers[msg.id]) mpState.peers[msg.id].ready = !!msg.ready;
    } else if (t === "WS_CAR_SYNC") {
      if (mpState.peers[msg.id]) mpState.peers[msg.id].car = msg.car || 0;
    } else if (t === "WS_TRACK_SYNC") {
      menuState.theme = msg.theme || 0;
      menuState.tod = msg.tod || 1;
    } else if (t === "WS_COUNTDOWN") {
      mpState.countdown = msg.duration || 3.5;
      startTransitionToRace(true);
    } else if (t === "WS_TELEM") {
      if (msg.id !== mpState.myPeerId && mpState.peers[msg.id]) {
        const pr = mpState.peers[msg.id];
        pr.worldZ = msg.z || 0;
        pr.x = msg.x || 0;
        pr.speed = msg.s || 0;
        pr.car = msg.c || 0;
        pr.hasFinished = !!msg.fin;
        pr.finishTime = msg.ft || 0;
      }
    }
  };
  return ws;
}

function sendWs(obj) {
  const ws = ensureWebSocket();
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// ============================================================================
//  7. SOUND SYNTHESIZER (WEB AUDIO API ENGINE ROAR & UI CHIMES)

let audioCtx = null;
function playTone(freq, dur = 0.08, type = 'sine', gainVal = 0.08) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function getSegment(z) {
  if (trackSegments.length === 0) buildTrack(menuState.theme);
  const N = trackSegments.length;
  let idx = Math.floor(z / SEG_LEN) % N;
  if (idx < 0) idx += N;
  return trackSegments[idx];
}

function getRaceStandings() {
  const list = [];
  list.push({
    name: `${profile.username || "Driver"} (${player.carModelName})`,
    isPlayer: true,
    hasFinished: player.raceFinished,
    finishTime: player.finishTime,
    progressZ: player.worldZ
  });
  traffic.forEach(t => {
    list.push({
      name: t.name,
      isPlayer: false,
      hasFinished: t.hasFinished,
      finishTime: t.finishTime,
      progressZ: t.worldZ
    });
  });
  Object.values(mpState.peers).forEach(pr => {
    list.push({
      name: `[ONLINE] ${pr.name}`,
      isPlayer: false,
      hasFinished: !!pr.hasFinished,
      finishTime: pr.finishTime || 0,
      progressZ: pr.worldZ || 0
    });
  });
  list.sort((a, b) => {
    if (a.hasFinished && b.hasFinished) return a.finishTime - b.finishTime;
    if (a.hasFinished !== b.hasFinished) return a.hasFinished ? -1 : 1;
    return b.progressZ - a.progressZ;
  });
  list.forEach((e, i) => e.position = i + 1);
  return list;
}

function updatePhysics(dt) {
  if (mpState.countdown > 0) {
    mpState.countdown -= dt;
    if (mpState.countdown <= 0) {
      mpState.countdown = -1;
      playTone(880, 0.25, 'triangle', 0.14);
    } else {
      return;
    }
  }

  const curSeg = getSegment(player.worldZ);
  const nextSeg = getSegment(player.worldZ + SEG_LEN);
  const slope = (nextSeg.elevation - curSeg.elevation) / SEG_LEN;

  // 1. Steering & ADAS Assist
  let steerInput = 0;
  if (keys.left) steerInput -= 1;
  if (keys.right) steerInput += 1;

  if (player.adasEnabled && steerInput === 0 && player.speed > 40) {
    // ADAS obstacle scan ahead
    let blocked = false;
    for (const npc of traffic) {
      const dz = npc.worldZ - player.worldZ;
      if (dz > 0 && dz < 750 && Math.abs(npc.x - player.x) < 0.23) {
        blocked = true;
        steerInput = (player.x > 0) ? -0.65 : 0.65;
        break;
      }
    }
  }

  const steerSpeed = 3.2 * player.gripMult;
  player.steerAngle += (steerInput - player.steerAngle) * Math.min(1, steerSpeed * dt);
  player.x += player.steerAngle * player.gripMult * (Math.max(40, player.speed) / 130) * 1.45 * dt;
  // Centrifugal curve pull
  player.x -= curSeg.curve * (player.speed / player.maxSpeed) * 0.42 * dt;
  player.x = Math.max(-1.25, Math.min(1.25, player.x));

  // 2. Throttle, Engine Torque Band & Braking
  let accel = 0;
  if (keys.up && !player.raceFinished) {
    const topRef = Math.max(215, player.maxSpeed + 18);
    const powerFactor = Math.max(0.38, Math.min(1.0, 1.0 - (player.speed / topRef)));
    const bandBonus = (player.speed < 95) ? player.lowTorque : ((player.speed > 130) ? player.highBoost : player.lowTorque * 0.35);
    accel = (player.accelRate + bandBonus) * powerFactor;
    player.boostBar = Math.min(1, player.boostBar + 1.2 * dt);
  } else {
    player.boostBar = Math.max(0, player.boostBar - 2.2 * dt);
  }

  if (keys.down) accel -= 98;
  if (keys.space) accel -= 145;
  if (Math.abs(player.x) > 1.02) accel -= 60; // Off-road drag
  accel -= (0.00018 * player.speed * player.speed + 4.0 + slope * 0.045);

  player.speed = Math.max(0, Math.min(player.maxSpeed, player.speed + accel * dt));
  const worldSpeed = (player.speed > 0.2) ? ((player.speed / 3.6) * 62.0 + 240.0 * Math.min(1, player.speed / 22)) * dt : 0;

  if (!player.raceFinished && (keys.up || player.speed > 1)) {
    player.raceTime += dt;
  }
  player.worldZ += worldSpeed;
  player.distanceKm += (player.speed / 3600) * dt;
  player.score += Math.floor((player.speed / 3600) * dt * 320);

  // 3. Vertical Bump, Hill-Crest Hop & Coilover Suspension Physics
  {
    const speedNorm = Math.min(1.25, player.speed / 185);
    const slopeDelta = player.prevSlope - slope;
    player.prevSlope = slope;

    const crestImpulse = Math.max(-32, Math.min(46, slopeDelta * speedNorm * 0.55));
    if (Math.abs(crestImpulse) > 1.0 && speedNorm > 0.15) {
      player.verticalVelocity += crestImpulse;
    }

    let unevenness = 1.0 + Math.abs(slope) * 0.015 + Math.abs(curSeg.roadBank) * 4.0;
    const onKerb = (Math.abs(player.x) > 0.88 && Math.abs(player.x) <= 1.05);
    if (onKerb) unevenness += 2.2;
    if (Math.abs(player.x) > 1.05) unevenness += 3.2;

    const roadWave = Math.sin(player.worldZ * 0.011) * 0.55
                   + Math.sin(player.worldZ * 0.029) * 0.35
                   + (onKerb ? Math.sin(player.worldZ * 0.14) * 0.65 : 0);
    const bumpExcitation = (roadWave + 0.22 * Math.max(0, roadWave)) * unevenness * speedNorm * 58.0;

    const prevOff = player.verticalOffset;
    const kSpring = 150.0, cDamper = 17.5;
    let vAccel = 0;
    if (player.verticalOffset > 4.0) {
      vAccel = -125.0 - (player.verticalOffset - 4.0) * 45.0 - cDamper * 0.45 * player.verticalVelocity;
    } else {
      vAccel = -kSpring * player.verticalOffset - cDamper * player.verticalVelocity + bumpExcitation;
    }
    player.verticalVelocity = Math.max(-65, Math.min(65, player.verticalVelocity + vAccel * dt));
    player.verticalOffset = Math.max(-4.5, Math.min(14.0, player.verticalOffset + player.verticalVelocity * dt));

    if (prevOff > 2.5 && player.verticalOffset <= 2.5 && player.verticalVelocity < -12) {
      player.pitchG -= 0.016;
    }
  }

  // Pitch, Roll & Gear/RPM
  let targetPitch = keys.down ? -0.055 : (keys.up ? 0.032 : 0);
  targetPitch += (slope * 0.00012) + (player.verticalOffset * 0.0022);
  player.pitchG += (targetPitch - player.pitchG) * 6.0 * dt;
  const targetRoll = -player.steerAngle * (player.speed / 200) * 0.055;
  player.rollG += (targetRoll - player.rollG) * 7.0 * dt;

  const s = player.speed;
  player.gear = (s < 38) ? 1 : (s < 72) ? 2 : (s < 108) ? 3 : (s < 144) ? 4 : (s < 180) ? 5 : 6;
  player.rpm = 1100 + ((s % 38) / 38) * 6400;

  // 4. AI Traffic & Collisions
  if (player.crashTimer > 0) player.crashTimer -= dt;
  const lanes = [-0.72, -0.24, 0.24, 0.72];
  for (const npc of traffic) {
    if (npc.speed < npc.maxSpeed) npc.speed = Math.min(npc.maxSpeed, npc.speed + 42 * dt);
    const npcWorldSpd = ((npc.speed / 3.6) * 62.0 + 240.0) * dt;
    npc.worldZ += npcWorldSpd;
    npc.laneTimer -= dt;
    if (npc.laneTimer <= 0) {
      npc.laneTimer = 2.5 + Math.random() * 2.5;
      npc.targetX = lanes[Math.floor(Math.random() * 4)];
    }
    npc.x += (npc.targetX - npc.x) * 2.5 * dt;

    if (!npc.hasFinished && npc.worldZ >= totalTrackZ) {
      npc.hasFinished = true;
      npc.finishTime = Math.max(0.1, player.raceTime);
    }

    // Collision check
    const dz = Math.abs(npc.worldZ - player.worldZ);
    const dx = Math.abs(npc.x - player.x);
    if (dz < 145 && dx < 0.21 && player.crashTimer <= 0 && !player.raceFinished) {
      player.crashTimer = 1.1;
      player.crashCount++;
      const dmg = Math.max(4, Math.round(14 / player.armorMult));
      player.health = Math.max(10, player.health - dmg);
      player.speed *= 0.68;
      player.verticalVelocity = 24;
      playTone(110, 0.22, 'sawtooth', 0.16);
    }
  }

  // 5. Standings & Finish Line Coin Reward Calculation
  const standings = getRaceStandings();
  for (const e of standings) {
    if (e.isPlayer) player.currentPosition = e.position;
  }

  if (!player.raceFinished && player.worldZ >= totalTrackZ) {
    player.raceFinished = true;
    player.finishTime = Math.max(0.1, player.raceTime);
    traffic.forEach((npc, idx) => {
      if (!npc.hasFinished) {
        const remZ = Math.max(40, totalTrackZ - npc.worldZ);
        const uPerSec = (Math.max(160, npc.speed) / 3.6) * 62 + 240;
        npc.finishTime = player.finishTime + (remZ / uPerSec) + idx * 0.18;
        npc.hasFinished = true;
      }
    });

    const finalStandings = getRaceStandings();
    for (const e of finalStandings) {
      if (e.isPlayer) player.currentPosition = e.position;
    }

    const baseTable = [0, 500, 350, 250, 160, 110];
    const baseCoins = baseTable[player.currentPosition] || 70;
    const cleanBonus = (player.crashCount === 0) ? 100 : 0;
    const diffMult = DIFFICULTIES[menuState.difficulty].mult;
    const mpMult = mpState.connected ? 1.25 : 1.0;
    const totalCoins = Math.round((baseCoins + cleanBonus) * diffMult * mpMult);

    player.lastRaceBaseCoins = baseCoins;
    player.lastRaceCleanBonus = cleanBonus;
    player.lastRaceMult = diffMult * mpMult;
    player.lastRaceCoinsEarned = totalCoins;

    profile.coins += totalCoins;
    profile.races++;
    if (player.currentPosition === 1) profile.wins++;
    if (player.currentPosition <= 3) profile.podiums++;
    syncProfileToServer({
      position: player.currentPosition,
      coinsEarned: totalCoins,
      carId: profile.selectedCar,
      engineId: profile.selectedEngine
    });
    playTone(587.33, 0.18, 'triangle', 0.14);
    setTimeout(() => playTone(880, 0.32, 'triangle', 0.16), 150);
  }

  // Send 25Hz multiplayer telemetry
  if (mpState.connected) {
    const now = performance.now();
    if (now - mpState.lastTelemSent > 40) {
      mpState.lastTelemSent = now;
      sendWs({
        type: "WS_TELEM",
        id: mpState.myPeerId,
        z: Math.round(player.worldZ),
        x: Number(player.x.toFixed(3)),
        s: Math.round(player.speed),
        c: profile.selectedCar,
        fin: player.raceFinished,
        ft: Number(player.finishTime.toFixed(2))
      });
    }
  }
}

// ============================================================================
//  9. DRAWING HELPERS & 3D PHONG/GOURAUD SUPERCAR RENDERER
// ============================================================================
function roundRect(x, y, w, h, r, fill, stroke, lineW = 1.2) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineW; ctx.stroke(); }
}

function hitRect(r) {
  return r && mouseX >= r.x && mouseX <= r.x + r.w && mouseY >= r.y && mouseY <= r.y + r.h;
}

// Draw a 3D Phong & Gouraud shaded supercar using the exact exported C++ Qt6 RasterRenderer sprite
function draw3DSupercar(cx, cy, cw, ch, carIdx, isBraking = false, yawShift = 0, rollDeg = 0, spitFlames = false) {
  const idx = ((carIdx % 4) + 4) % 4;
  const spriteKey = isBraking ? `player_car_${idx}_brake` : `player_car_${idx}`;
  if (isImgReady(spriteKey)) {
    const img = ASSETS[spriteKey];
    ctx.save();
    ctx.translate(cx + yawShift * 0.25, cy);
    if (Math.abs(rollDeg) > 0.01) ctx.rotate(rollDeg * Math.PI / 180);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    const drawW = cw * (400 / 316);
    const drawH = ch * (220 / 148);
    ctx.drawImage(img, -drawW * 0.5, -drawH * 0.86, drawW, drawH);
    if (spitFlames) {
      for (let side = -1; side <= 1; side += 2) {
        const fx = side * cw * 0.25, fy = -ch * 0.14;
        const fg = ctx.createRadialGradient(fx, fy, 1, fx, fy, cw * 0.10);
        fg.addColorStop(0, "rgba(255,255,255,0.95)");
        fg.addColorStop(0.35, "rgba(0,225,255,0.85)");
        fg.addColorStop(0.7, "rgba(255,90,20,0.5)");
        fg.addColorStop(1, "rgba(255,40,10,0)");
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.ellipse(fx, fy + 4, cw * 0.06, ch * 0.13, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
    return;
  }

  const car = CARS[carIdx] || CARS[0];
  ctx.save();
  ctx.translate(cx, cy);
  if (Math.abs(rollDeg) > 0.01) ctx.rotate(rollDeg * Math.PI / 180);

  // 1. Ground contact AO shadow & crimson tail-light reflection pool
  const ao = ctx.createRadialGradient(0, -4, 4, 0, -4, cw * 0.56);
  ao.addColorStop(0, "rgba(4,6,12,0.92)");
  ao.addColorStop(0.7, "rgba(6,8,14,0.55)");
  ao.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = ao;
  ctx.beginPath();
  ctx.ellipse(0, -3, cw * 0.55, ch * 0.16, 0, 0, Math.PI * 2);
  ctx.fill();

  const poolAlpha = isBraking ? 0.62 : 0.34;
  for (let side = -1; side <= 1; side += 2) {
    const pg = ctx.createRadialGradient(side * cw * 0.30, 5, 2, side * cw * 0.30, 5, cw * 0.22);
    pg.addColorStop(0, `rgba(255,32,38,${poolAlpha})`);
    pg.addColorStop(1, "rgba(255,0,0,0)");
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.ellipse(side * cw * 0.30, 5, cw * 0.22, ch * 0.10, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // 2. Wide 3D cylindrical rear performance tires + deep-dish alloy rim lip
  const tw = cw * 0.17, th = ch * 0.32;
  for (let side = -1; side <= 1; side += 2) {
    const tx = (side < 0) ? -cw * 0.45 : (cw * 0.45 - tw);
    const ty = -th + 2;
    const tg = ctx.createLinearGradient(tx, ty, tx + tw, ty);
    tg.addColorStop(0, "#080a0e");
    tg.addColorStop(0.32, "#242934");
    tg.addColorStop(0.55, "#3a4254");
    tg.addColorStop(1, "#080a0e");
    roundRect(tx, ty, tw, th, 5, tg, "#06080c", 1.2);
  }

  // 3. 3D Foreshortened receding side flanks & NACA ducts
  for (let side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.moveTo(side * cw * 0.49, -ch * 0.28);
    ctx.lineTo(side * cw * 0.36 + yawShift * 0.5, -ch * 0.52);
    ctx.lineTo(side * cw * 0.29 + yawShift * 0.5, -ch * 0.70);
    ctx.lineTo(side * cw * 0.38 + yawShift * 0.2, -ch * 0.62);
    ctx.closePath();
    ctx.fillStyle = car.bodyMid;
    ctx.fill();
    ctx.strokeStyle = car.bodyHi;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 4. Sculpted Widebody Rear Haunches with Dark Automotive Horizon Reflection Band
  const bg = ctx.createLinearGradient(0, -ch * 0.66, 0, -ch * 0.15);
  bg.addColorStop(0.0, car.bodyHi);
  bg.addColorStop(0.22, car.bodyMid);
  bg.addColorStop(0.38, car.bodyLo); // Dark automotive horizon reflection crease
  bg.addColorStop(0.54, car.bodyMid);
  bg.addColorStop(1.0, car.bodyLo);

  ctx.beginPath();
  ctx.moveTo(-cw * 0.49, -ch * 0.21);
  ctx.bezierCurveTo(-cw * 0.52, -ch * 0.42, -cw * 0.47, -ch * 0.59, -cw * 0.38 + yawShift * 0.25, -ch * 0.64);
  ctx.lineTo(cw * 0.38 + yawShift * 0.25, -ch * 0.64);
  ctx.bezierCurveTo(cw * 0.47, -ch * 0.59, cw * 0.52, -ch * 0.42, cw * 0.49, -ch * 0.21);
  ctx.lineTo(cw * 0.34, -ch * 0.16);
  ctx.lineTo(-cw * 0.34, -ch * 0.16);
  ctx.closePath();
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = "rgba(210,225,245,0.65)";
  ctx.lineWidth = 1.3;
  ctx.stroke();

  // Dual-Lobe 3D Blinn-Phong Specular Clear-Coat Hotspots on Left & Right Fender Haunches
  for (let side = -1; side <= 1; side += 2) {
    const hx = side * cw * 0.37 + yawShift * 0.18;
    const hy = -ch * 0.52;
    const pg = ctx.createRadialGradient(hx, hy, 1, hx, hy, cw * 0.16);
    pg.addColorStop(0, "rgba(255,255,255,0.88)");
    pg.addColorStop(0.45, "rgba(220,240,255,0.34)");
    pg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.ellipse(hx, hy, cw * 0.16, ch * 0.13, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // 5. Fastback Cabin Dome, Flying-Buttress C-Pillars & Rear Glass Canopy
  const rg = ctx.createLinearGradient(0, -ch * 0.95, 0, -ch * 0.62);
  rg.addColorStop(0, car.bodyHi);
  rg.addColorStop(0.45, car.bodyMid);
  rg.addColorStop(1, car.bodyLo);
  ctx.beginPath();
  ctx.moveTo(-cw * 0.36 + yawShift * 0.25, -ch * 0.62);
  ctx.bezierCurveTo(-cw * 0.30 + yawShift * 0.4, -ch * 0.84, -cw * 0.22 + yawShift * 0.5, -ch * 0.94, -cw * 0.16 + yawShift * 0.55, -ch * 0.95);
  ctx.lineTo(cw * 0.16 + yawShift * 0.55, -ch * 0.95);
  ctx.bezierCurveTo(cw * 0.22 + yawShift * 0.5, -ch * 0.94, cw * 0.30 + yawShift * 0.4, -ch * 0.84, cw * 0.36 + yawShift * 0.25, -ch * 0.62);
  ctx.closePath();
  ctx.fillStyle = rg;
  ctx.fill();
  ctx.strokeStyle = "rgba(225,238,255,0.75)";
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Roof Crown Phong Hotspot
  const rPhong = ctx.createRadialGradient(yawShift * 0.45, -ch * 0.90, 1, yawShift * 0.45, -ch * 0.90, cw * 0.20);
  rPhong.addColorStop(0, "rgba(255,255,255,0.85)");
  rPhong.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = rPhong;
  ctx.beginPath();
  ctx.ellipse(yawShift * 0.45, -ch * 0.90, cw * 0.20, ch * 0.11, 0, 0, Math.PI * 2);
  ctx.fill();

  // Rear Canopy Glass + Louvers
  ctx.beginPath();
  ctx.moveTo(-cw * 0.15 + yawShift * 0.5, -ch * 0.89);
  ctx.lineTo(cw * 0.15 + yawShift * 0.5, -ch * 0.89);
  ctx.lineTo(cw * 0.22 + yawShift * 0.28, -ch * 0.64);
  ctx.lineTo(-cw * 0.22 + yawShift * 0.28, -ch * 0.64);
  ctx.closePath();
  ctx.fillStyle = "#0b1018";
  ctx.fill();

  // 6. Recessed Rear Fascia, Tail Lights & Exhausts
  roundRect(-cw * 0.42, -ch * 0.56, cw * 0.84, ch * 0.17, 4, "#0d1016", "#3e4654", 1.2);
  const tlCol = isBraking ? "#ff2828" : "#c81620";
  if (carIdx === 1) {
    // VORTEX V12 Razor Chevron LEDs
    ctx.strokeStyle = tlCol;
    ctx.lineWidth = isBraking ? 3.5 : 2.2;
    for (let side = -1; side <= 1; side += 2) {
      ctx.beginPath();
      ctx.moveTo(side * cw * 0.38, -ch * 0.53);
      ctx.lineTo(side * cw * 0.22, -ch * 0.48);
      ctx.lineTo(side * cw * 0.38, -ch * 0.43);
      ctx.stroke();
    }
  } else if (carIdx === 2) {
    // DRIFT SPEC-R Quad Skyline Circles
    for (let side = -1; side <= 1; side += 2) {
      for (let c = -1; c <= 1; c += 2) {
        ctx.fillStyle = tlCol;
        ctx.beginPath();
        ctx.arc(side * cw * 0.28 + c * cw * 0.05, -ch * 0.48, cw * 0.034, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else {
    // Continuous LED Strip + Dual Halo Clusters
    roundRect(-cw * 0.40, -ch * 0.53, cw * 0.23, ch * 0.11, 3, tlCol, "#ff8888", 1);
    roundRect(cw * 0.17, -ch * 0.53, cw * 0.23, ch * 0.11, 3, tlCol, "#ff8888", 1);
  }

  // Rear Wing / Spoiler
  const wingY = -ch * (carIdx === 2 ? 0.81 : 0.67);
  roundRect(-cw * 0.46 + yawShift * 0.25, wingY, cw * 0.92, ch * 0.055, 3, "#181c24", car.accent, 1.4);

  // Twin Nitro Exhaust Flames
  if (spitFlames) {
    for (let side = -1; side <= 1; side += 2) {
      const fx = side * cw * 0.24, fy = -ch * 0.14;
      const fg = ctx.createRadialGradient(fx, fy, 1, fx, fy, cw * 0.08);
      fg.addColorStop(0, "#ffffff");
      fg.addColorStop(0.4, "#00e5ff");
      fg.addColorStop(1, "rgba(255,60,10,0)");
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.ellipse(fx, fy + 4, cw * 0.05, ch * 0.12, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// ============================================================================
//  10. 3D ROAD, SURROUNDINGS, COCKPIT & HUD RENDERER
// ============================================================================
function renderWorldAndHUD() {
  const theme = CIRCUITS[menuState.theme] || CIRCUITS[0];
  const isNight = (menuState.tod === 2);
  const isDay = (menuState.tod === 0);

  const horizonY = H * 0.42 + player.pitchG * 140;

  // 1. Genuine C++ Qt6 Sky & 3D Mountain Backdrop (smoothly parallax-scrolled with curves)
  const bgKey = `backdrop_${menuState.theme}_${menuState.tod}`;
  if (isImgReady(bgKey)) {
    const bgImg = ASSETS[bgKey];
    const bgH = Math.max(horizonY + 26, H * 0.48);
    const bgW = W;
    let bgOff = Math.floor((player.worldZ * 0.035 + getSegment(player.worldZ).curve * 28) % bgW);
    if (bgOff < 0) bgOff += bgW;
    ctx.drawImage(bgImg, -bgOff, 0, bgW, bgH);
    ctx.drawImage(bgImg, bgW - bgOff, 0, bgW, bgH);
  } else {
    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY + 20);
    if (isNight) {
      skyGrad.addColorStop(0, "#050712");
      skyGrad.addColorStop(0.6, "#0d162c");
      skyGrad.addColorStop(1, "#1c2848");
    } else if (isDay) {
      skyGrad.addColorStop(0, "#184b8a");
      skyGrad.addColorStop(0.6, "#4d8fd6");
      skyGrad.addColorStop(1, "#b8dcf8");
    } else {
      skyGrad.addColorStop(0, theme.skyTop);
      skyGrad.addColorStop(0.55, theme.skyMid);
      skyGrad.addColorStop(1, theme.skyBot);
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, horizonY + 10);
  }

  // Base terrain fill below horizon
  ctx.fillStyle = isNight ? "#0d121c" : theme.ground;
  ctx.fillRect(0, horizonY, W, H - horizonY);

  // 2. Project 70 Road Segments with Curves, Hills & Vertical Bump Camera Lift
  const N = trackSegments.length;
  const baseIdx = Math.floor(player.worldZ / SEG_LEN);
  const basePct = (player.worldZ % SEG_LEN) / SEG_LEN;
  const seg0 = getSegment(player.worldZ);
  const seg1 = getSegment(player.worldZ + SEG_LEN);
  const baseElev = seg0.elevation + (seg1.elevation - seg0.elevation) * basePct;
  const eyeHeight = baseElev + 950 + player.verticalOffset * 12.5;
  const camX = player.x * ROAD_WIDTH;
  const camDepth = 0.82;

  let dx = -seg0.curve * basePct;
  let x = -dx * basePct;
  const projSegs = [];

  for (let n = 0; n < 72; n++) {
    const seg = trackSegments[(baseIdx + n) % N];
    const nextS = trackSegments[(baseIdx + n + 1) % N];
    const z1 = (baseIdx + n) * SEG_LEN - player.worldZ;
    const z2 = (baseIdx + n + 1) * SEG_LEN - player.worldZ;
    x += dx;
    dx += seg.curve;

    const cZ1 = Math.max(10, z1);
    const cZ2 = Math.max(10, z2);
    const scale1 = camDepth / cZ1;
    const scale2 = camDepth / cZ2;

    const sx1 = (W / 2) + scale1 * (x - camX) * (W / 2);
    const sy1 = horizonY - scale1 * (seg.elevation - eyeHeight) * (H / 2);
    const sw1 = scale1 * ROAD_WIDTH * (W / 2);

    const sx2 = (W / 2) + scale2 * (x + dx - camX) * (W / 2);
    const sy2 = horizonY - scale2 * (nextS.elevation - eyeHeight) * (H / 2);
    const sw2 = scale2 * ROAD_WIDTH * (W / 2);

    projSegs.push({ seg, n, cZ1, sx1, sy1, sw1, sx2, sy2, sw2 });
  }

  // Draw Road Segments Back-to-Front
  for (let i = projSegs.length - 1; i >= 0; i--) {
    const ps = projSegs[i];
    if (ps.sy1 <= ps.sy2) continue;

    // Terrain strip
    ctx.fillStyle = (ps.seg.index % 2 === 0)
      ? (isNight ? "#0e1420" : theme.ground)
      : (isNight ? "#0b101a" : theme.berm);
    ctx.fillRect(0, ps.sy2, W, ps.sy1 - ps.sy2 + 1);

    // 3D Sculpted Roadside Embankment Slopes
    if (ps.n < 52) {
      const bIn1 = ps.sw1 * 1.26, bIn2 = ps.sw2 * 1.26;
      const bMid1 = ps.sw1 * 1.95, bMid2 = ps.sw2 * 1.95;
      const rH1 = ps.sw1 * 0.22, rH2 = ps.sw2 * 0.22;
      ctx.fillStyle = isNight ? "#161e2e" : theme.berm;
      // Left embankment
      ctx.beginPath();
      ctx.moveTo(ps.sx1 - bMid1, ps.sy1 - rH1);
      ctx.lineTo(ps.sx2 - bMid2, ps.sy2 - rH2);
      ctx.lineTo(ps.sx2 - bIn2, ps.sy2);
      ctx.lineTo(ps.sx1 - bIn1, ps.sy1);
      ctx.fill();
      // Right embankment
      ctx.beginPath();
      ctx.moveTo(ps.sx1 + bIn1, ps.sy1);
      ctx.lineTo(ps.sx2 + bIn2, ps.sy2);
      ctx.lineTo(ps.sx2 + bMid2, ps.sy2 - rH2);
      ctx.lineTo(ps.sx1 + bMid1, ps.sy1 - rH1);
      ctx.fill();
    }

    // 3D Beveled Rumble Kerbs
    const r1 = ps.sw1 * 1.12, r2 = ps.sw2 * 1.12;
    ctx.fillStyle = ps.seg.isRed ? "#e0282e" : "#f2f4f8";
    ctx.beginPath();
    ctx.moveTo(ps.sx1 - r1, ps.sy1);
    ctx.lineTo(ps.sx2 - r2, ps.sy2);
    ctx.lineTo(ps.sx2 + r2, ps.sy2);
    ctx.lineTo(ps.sx1 + r1, ps.sy1);
    ctx.fill();

    // Asphalt Road Surface with Phong Specular Crown
    ctx.fillStyle = (ps.seg.index % 2 === 0)
      ? (isNight ? "#181c26" : "#383c44")
      : (isNight ? "#141820" : "#31353d");
    ctx.beginPath();
    ctx.moveTo(ps.sx1 - ps.sw1, ps.sy1);
    ctx.lineTo(ps.sx2 - ps.sw2, ps.sy2);
    ctx.lineTo(ps.sx2 + ps.sw2, ps.sy2);
    ctx.lineTo(ps.sx1 + ps.sw1, ps.sy1);
    ctx.fill();

    // Specular Reflection Lobe down center of road
    if (ps.n < 32) {
      ctx.fillStyle = isNight ? "rgba(110,185,255,0.08)" : "rgba(255,235,200,0.09)";
      ctx.beginPath();
      ctx.moveTo(ps.sx1 - ps.sw1 * 0.32, ps.sy1);
      ctx.lineTo(ps.sx2 - ps.sw2 * 0.32, ps.sy2);
      ctx.lineTo(ps.sx2 + ps.sw2 * 0.32, ps.sy2);
      ctx.lineTo(ps.sx1 + ps.sw1 * 0.32, ps.sy1);
      ctx.fill();
    }

    // Lane Divider Dashes
    if (ps.seg.index % 3 === 0) {
      ctx.strokeStyle = "rgba(235,242,255,0.75)";
      ctx.lineWidth = Math.max(1, ps.sw1 * 0.015);
      for (const lOff of [-0.5, 0, 0.5]) {
        ctx.beginPath();
        ctx.moveTo(ps.sx1 + ps.sw1 * lOff, ps.sy1);
        ctx.lineTo(ps.sx2 + ps.sw2 * lOff, ps.sy2);
        ctx.stroke();
      }
    }

    // 3D AR Trajectory Gap Rails ([3] AR GAP)
    if (player.arGuidesEnabled && ps.n >= 2 && ps.n <= 20) {
      ctx.strokeStyle = "rgba(0,235,255,0.55)";
      ctx.lineWidth = Math.max(1.5, ps.sw1 * 0.018);
      for (const side of [-0.18, 0.18]) {
        ctx.beginPath();
        ctx.moveTo(ps.sx1 + ps.sw1 * (player.x + side), ps.sy1);
        ctx.lineTo(ps.sx2 + ps.sw2 * (player.x + side), ps.sy2);
        ctx.stroke();
      }
    }
  }

  // 3. Genuine C++ Qt6 Roadside Scenery Sprites & Rival / Multiplayer Cars (Back-to-Front)
  const themeSceneryL = [0, 1, 2, 3]; // Palm, Pine, Streetlight, Cactus
  const themeSceneryR = [5, 9, 12, 10]; // Billboard, Wind Turbine, Neon Hoarding, Rock Arch
  for (let i = projSegs.length - 1; i >= 1; i--) {
    const ps = projSegs[i];
    if (ps.seg.sceneryLeft && ps.n < 52) {
      const scId = (ps.seg.sceneryLeft === 'rock') ? 4 : themeSceneryL[menuState.theme];
      const scKey = `scenery_${scId}`;
      if (isImgReady(scKey)) {
        const img = ASSETS[scKey];
        const sw = ps.sw1 * 0.65;
        const sh = sw * (img.naturalHeight / img.naturalWidth);
        const tx = ps.sx1 - ps.sw1 * 1.48;
        ctx.drawImage(img, tx - sw * 0.5, ps.sy1 - sh, sw, sh);
      }
    }
    if (ps.seg.sceneryRight && ps.n < 52) {
      const scId = (ps.seg.sceneryRight === 'arch') ? themeSceneryR[menuState.theme] : themeSceneryL[menuState.theme];
      const scKey = `scenery_${scId}`;
      if (isImgReady(scKey)) {
        const img = ASSETS[scKey];
        const sw = ps.sw1 * (ps.seg.sceneryRight === 'arch' ? 0.95 : 0.65);
        const sh = sw * (img.naturalHeight / img.naturalWidth);
        const tx = ps.sx1 + ps.sw1 * 1.48;
        ctx.drawImage(img, tx - sw * 0.5, ps.sy1 - sh, sw, sh);
      }
    }
    if (ps.seg.gantry && ps.n < 52 && isImgReady('scenery_8')) {
      const img = ASSETS['scenery_8'];
      const gw = ps.sw1 * 2.45;
      const gh = gw * (img.naturalHeight / img.naturalWidth);
      ctx.drawImage(img, ps.sx1 - gw * 0.5, ps.sy1 - gh * 0.96, gw, gh);
    }

    // Rival AI & Remote Multiplayer Cars in this depth slice
    const zMin = player.worldZ + (ps.n - 1) * SEG_LEN;
    const zMax = player.worldZ + ps.n * SEG_LEN;
    const allRivals = [...traffic];
    Object.values(mpState.peers).forEach(pr => {
      allRivals.push({
        name: `[P${pr.id + 1}] ${pr.name}`,
        carModel: pr.car || 0,
        worldZ: pr.worldZ || 0,
        x: pr.x || 0,
        isRemote: true
      });
    });

    for (const rv of allRivals) {
      if (rv.worldZ >= zMin && rv.worldZ < zMax) {
        const cx = ps.sx1 + ps.sw1 * rv.x;
        const cy = ps.sy1;
        const cw = Math.max(18, ps.sw1 * 0.36);
        const ch = cw * 0.48;
        draw3DSupercar(cx, cy, cw, ch, rv.carModel % 4, false, 0, 0, false);
        if (cw > 34) {
          roundRect(cx - 48, cy - ch - 18, 96, 14, 3, "rgba(10,16,26,0.85)", rv.isRemote ? "#00e5ff" : "#ffc846", 1);
          ctx.fillStyle = rv.isRemote ? "#78f5ff" : "#ffe082";
          ctx.font = "bold 8px Arial";
          ctx.textAlign = "center";
          ctx.fillText(rv.name, cx, cy - ch - 8);
        }
      }
    }
  }

  // 4. Render Player Vehicle (3rd-Person Chase Supercar OR 1st-Person Cockpit Dashboard)
  if (player.thirdPersonView) {
    const bumpUp = Math.max(-4.5, Math.min(14.0, player.verticalOffset));
    const groundY = H - 34 + player.pitchG * 20;
    const carX = W * 0.5 + player.steerAngle * 52 - player.rollG * 28;
    const carY = groundY - bumpUp;
    const rollDeg = player.steerAngle * 4.2 + player.rollG * 8.0;
    const yawShift = player.steerAngle * 14.0;
    const flames = keys.up && (player.rpm > 5400 || player.boostBar > 0.4);
    draw3DSupercar(carX, carY, 316, 148, profile.selectedCar, keys.down, yawShift, rollDeg, flames);
  } else {
    // 1st-Person Genuine C++ Qt6 Cockpit Dashboard, Rotating Steering Wheel, Gauges & Mirrors
    const dashX = Math.round(player.rollG * 60);
    const dashY = Math.round(player.pitchG * 90 - player.verticalOffset * 0.85);

    // Side & Rearview Mirrors from RasterAssets
    if (isImgReady('mirror_rear')) {
      ctx.drawImage(ASSETS['mirror_rear'], W / 2 - 145, 52, 290, 62);
    }
    if (isImgReady('mirror_left')) {
      ctx.drawImage(ASSETS['mirror_left'], 12, H - 305 + dashY * 0.5, 138, 86);
    }
    if (isImgReady('mirror_right')) {
      ctx.drawImage(ASSETS['mirror_right'], W - 150, H - 305 + dashY * 0.5, 138, 86);
    }

    // Genuine C++ Dashboard Cowling
    if (isImgReady('dashboard')) {
      ctx.drawImage(ASSETS['dashboard'], dashX - 18, dashY, W + 36, H + 12);
    } else {
      const dg = ctx.createLinearGradient(0, H - 235 + dashY, 0, H);
      dg.addColorStop(0, "#192130");
      dg.addColorStop(1, "#080b12");
      roundRect(-20 + dashX, H - 225 + dashY, W + 40, 250, 28, dg, "#344660", 2);
    }

    // Genuine C++ Tachometer & Speedometer Dials + Live Needles
    const drawQtGauge = (imgKey, gx, gy, size, val, maxVal) => {
      if (isImgReady(imgKey)) {
        ctx.drawImage(ASSETS[imgKey], gx - size / 2, gy - size / 2, size, size);
      }
      const frac = Math.min(1, Math.max(0, val / maxVal));
      const ang = (-135 + frac * 270) * Math.PI / 180;
      ctx.save();
      ctx.translate(gx, gy);
      ctx.rotate(ang);
      if (isImgReady('needle')) {
        ctx.drawImage(ASSETS['needle'], -8, -size * 0.42, 16, size * 0.52);
      } else {
        ctx.strokeStyle = "#ff3b47"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, -size * 0.38); ctx.stroke();
      }
      ctx.restore();
    };
    drawQtGauge('dial_rpm', 286 + dashX, 588 + dashY, 128, player.rpm, 8000);
    drawQtGauge('dial_speed', 428 + dashX, 588 + dashY, 128, player.speed, 240);

    // Genuine C++ Steering Wheel rotating smoothly with steerAngle
    if (isImgReady('wheel')) {
      ctx.save();
      ctx.translate(356 + dashX, 652 + dashY);
      ctx.rotate(player.steerAngle * 0.72);
      ctx.drawImage(ASSETS['wheel'], -148, -148, 296, 296);
      ctx.restore();
    }

    // Center Console Touchscreen Infotainment
    const sx = 615 + dashX, sy = 505 + dashY, sw = 355, sh = 175;
    roundRect(sx, sy, sw, sh, 8, "rgba(11,19,32,0.92)", "#00d8ff", 1.5);
    const tabs = ["WEB", "MUSIC", "RADAR", "BUILD"];
    for (let t = 0; t < 4; t++) {
      const tw = sw / 4;
      roundRect(sx + t * tw, sy, tw, 24, 3, player.infoMode === t ? "rgba(0,215,255,0.28)" : "#0e1726", "#263850", 1);
      ctx.fillStyle = player.infoMode === t ? "#00f0ff" : "#9ab0cc";
      ctx.font = "bold 9px Arial"; ctx.textAlign = "center";
      ctx.fillText(tabs[t], sx + t * tw + tw / 2, sy + 16);
    }
    ctx.fillStyle = "#d8ecff"; ctx.font = "bold 11px Arial"; ctx.textAlign = "left";
    ctx.fillText(`CHASSIS: ${player.carModelName}`, sx + 16, sy + 56);
    ctx.fillStyle = "#ffd65a";
    ctx.fillText(`ENGINE: ${player.engineModelName} (${player.hp} HP)`, sx + 16, sy + 80);
    ctx.fillStyle = "#50f096";
    ctx.fillText(`TOP SPEED: ${Math.round(player.maxSpeed)} KM/H  •  ARMOR: ${Math.round(player.armorMult * 100)}%`, sx + 16, sy + 104);
    ctx.fillStyle = "#88c8ff";
    ctx.fillText(`SUSPENSION TRAVEL: ${player.verticalOffset.toFixed(1)} PX`, sx + 16, sy + 128);
  }

  // 5. Top Motorsport HUD Bar (Overlap-Free Layout)
  roundRect(0, 0, W, 50, 0, "rgba(8,12,20,0.92)", null);
  ctx.fillStyle = "#00e5ff"; ctx.fillRect(0, 48, W, 2);

  // Left: Speed, Gear & Camera Switch Button
  ctx.fillStyle = "#fff"; ctx.font = "900 18px Arial"; ctx.textAlign = "left";
  ctx.fillText(`${Math.round(player.speed)} KM/H`, 16, 24);
  ctx.fillStyle = "#00e5ff"; ctx.font = "bold 10px Arial";
  ctx.fillText(`GEAR ${player.gear}  •  ${Math.round(player.rpm)} RPM`, 16, 41);

  // Camera Switch Button & POS/TIME Badge
  roundRect(292, 6, 148, 22, 5, player.thirdPersonView ? "rgba(238,185,75,0.28)" : "rgba(0,210,255,0.25)",
            player.thirdPersonView ? "#f5c85f" : "#00ebff", 1.5);
  ctx.fillStyle = player.thirdPersonView ? "#ffe696" : "#b4f8ff";
  ctx.font = "bold 9px Arial"; ctx.textAlign = "center";
  ctx.fillText(player.thirdPersonView ? "1ST PERSON VIEW [C]" : "3RD PERSON VIEW [C]", 366, 20);

  roundRect(292, 30, 148, 17, 4, "rgba(18,24,36,0.9)", "#f5c84b", 1);
  ctx.fillStyle = "#ffdc5f"; ctx.font = "bold 9px Arial";
  const dispTime = player.raceFinished ? player.finishTime : player.raceTime;
  ctx.fillText(`POS ${player.currentPosition}/${player.totalRacers}  •  TIME ${dispTime.toFixed(1)}s`, 366, 42);

  // Center Turn Advisory Pill & Compact Quick-Keys Status Badge (Bounded to 260px so it never overlaps POS/TIME)
  const aheadCurve = getSegment(player.worldZ + 550).curve;
  const cx = W / 2;
  const isTurn = Math.abs(aheadCurve) > 0.7;
  roundRect(cx - 130, 6, 260, 22, 4, isTurn ? "rgba(255,165,25,0.22)" : "rgba(20,30,45,0.75)",
            isTurn ? "#ffbe28" : "#3a5070", 1.2);
  ctx.fillStyle = isTurn ? "#ffd448" : "#b4d7f5"; ctx.font = "bold 10px Arial";
  ctx.fillText(isTurn ? (aheadCurve > 0 ? "◀ SWEEPING CURVE LEFT" : "SWEEPING CURVE RIGHT ▶") : "▲ EXPRESSWAY SPEEDWAY ▲", cx, 21);

  roundRect(cx - 130, 30, 260, 17, 4, "rgba(14,20,30,0.85)", "#374b69", 1);
  ctx.fillStyle = "#a5d7f5"; ctx.font = "bold 9px Arial";
  ctx.fillText("[Y] REPAIR  •  [N] LIGHTING  •  [M] MENU", cx, 42);

  // 4 Interactive Feature Pills at btnY = 56 (Below header border)
  const pills = [
    { label: `[1] 3D MESH: ${player.zBuffer3DMode ? "ON" : "OFF"}`, act: player.zBuffer3DMode, col: "#00e6ff" },
    { label: `[2] ADAS: ${player.adasEnabled ? "ON" : "OFF"}`, act: player.adasEnabled, col: "#2df082" },
    { label: `[3] AR GAP: ${player.arGuidesEnabled ? "ON" : "OFF"}`, act: player.arGuidesEnabled, col: "#ffcd37" },
    { label: `[4] PIXEL: ${player.pixelSize}px`, act: player.pixelSize > 1, col: "#eb73ff" }
  ];
  const btnW = 132, btnH = 22, btnGap = 8;
  const startX = cx - (4 * btnW + 3 * btnGap) / 2;
  for (let i = 0; i < 4; i++) {
    const rx = startX + i * (btnW + btnGap);
    roundRect(rx, 56, btnW, btnH, 5, pills[i].act ? "rgba(0,210,255,0.22)" : "rgba(14,18,28,0.86)",
              pills[i].act ? pills[i].col : "#46546c", 1.3);
    ctx.fillStyle = pills[i].act ? "#fff" : "#a0b2ca";
    ctx.font = "bold 9px Arial";
    ctx.fillText(pills[i].label, rx + btnW / 2, 70);
  }

  // Right: Coins, Score & Integrity
  ctx.textAlign = "right";
  ctx.fillStyle = "#ffd84d"; ctx.font = "bold 12px Arial";
  ctx.fillText(`COINS: ${profile.coins} 🪙   •   SCORE: ${player.score}`, W - 18, 22);
  ctx.fillStyle = player.health > 40 ? "#38ef88" : "#ff4b55"; ctx.font = "bold 10px Arial";
  ctx.fillText(`INTEGRITY: ${player.health}%   •   ${player.carModelName} (${player.hp} HP)`, W - 18, 41);

  // Left Standings Tower at y = 56
  const standings = getRaceStandings();
  roundRect(14, 56, 210, 168, 6, "rgba(10,15,24,0.84)", "#283a52", 1.2);
  ctx.fillStyle = "#00e5ff"; ctx.font = "bold 9px Arial"; ctx.textAlign = "left";
  ctx.fillText("LIVE STANDINGS", 24, 72);
  for (let i = 0; i < Math.min(6, standings.length); i++) {
    const e = standings[i];
    const ry = 80 + i * 23;
    roundRect(20, ry, 198, 20, 3, e.isPlayer ? "rgba(0,220,255,0.25)" : "rgba(18,26,38,0.75)",
              e.isPlayer ? "#00e5ff" : null, 1);
    ctx.fillStyle = e.isPlayer ? "#8cf8ff" : "#dce6f5";
    ctx.font = "bold 9px Arial";
    ctx.fillText(`P${e.position}  ${e.name.substring(0, 22)}`, 26, ry + 14);
  }

  // Finish Line Scoreboard & Coin Reward Breakdown Overlay
  if (player.raceFinished) {
    const bw = 660, bh = 408, bx = (W - bw) / 2, by = (H - bh) / 2 - 10;
    roundRect(bx, by, bw, bh, 12, "rgba(10,14,22,0.97)", "#f5c855", 2.5);
    roundRect(bx + 14, by + 12, bw - 28, 36, 6, "rgba(245,195,70,0.18)", "#f5c855", 1);
    ctx.fillStyle = "#ffdc5f"; ctx.font = "900 14px Arial"; ctx.textAlign = "center";
    ctx.fillText(`CHECKERED FLAG — FINAL RACE STANDINGS (YOU: P${player.currentPosition}/${player.totalRacers})`, W / 2, by + 35);

    // Coin Reward Banner
    roundRect(bx + 14, by + 53, bw - 28, 36, 6, "rgba(48,36,10,0.9)", "#ffd241", 1.5);
    ctx.fillStyle = "#ffe155"; ctx.font = "bold 11px Arial"; ctx.textAlign = "left";
    const cleanStr = player.lastRaceCleanBonus > 0 ? ` + ${player.lastRaceCleanBonus} Clean` : "";
    ctx.fillText(`RACE REWARD: +${player.lastRaceCoinsEarned} COINS  (P${player.currentPosition} Base: ${player.lastRaceBaseCoins}${cleanStr} × ${player.lastRaceMult.toFixed(2)}x)`, bx + 26, by + 75);
    ctx.fillStyle = "#4bf596"; ctx.textAlign = "right";
    ctx.fillText(`VAULT: ${profile.coins} COINS`, bx + bw - 26, by + 75);

    for (let i = 0; i < Math.min(8, standings.length); i++) {
      const e = standings[i];
      const ry = by + 106 + i * 31;
      roundRect(bx + 14, ry, bw - 28, 26, 4, e.isPlayer ? "rgba(0,225,255,0.24)" : "rgba(20,26,38,0.8)",
                e.isPlayer ? "#00f0ff" : null, 1.2);
      ctx.fillStyle = e.isPlayer ? "#80f8ff" : (i === 0 ? "#ffdc5a" : "#dce6f5");
      ctx.font = "bold 11px Arial"; ctx.textAlign = "left";
      ctx.fillText(`P${e.position}`, bx + 26, ry + 17);
      ctx.fillText(e.name, bx + 85, ry + 17);
      ctx.textAlign = "right";
      ctx.fillText(`${e.finishTime.toFixed(2)}s`, bx + bw - 28, ry + 17);
    }

    roundRect(bx + 14, by + bh - 38, bw - 28, 26, 5, "rgba(245,195,70,0.16)", "#f5c855", 1);
    ctx.fillStyle = "#ffe673"; ctx.font = "bold 10px Arial"; ctx.textAlign = "center";
    ctx.fillText("PRESS [R] OR CLICK HERE FOR NEW RACE   •   PRESS [M] FOR GARAGE & MENU", W / 2, by + bh - 21);
  }

  // Multiplayer 3-2-1 Countdown Overlay
  if (mpState.countdown > 0) {
    const cdNum = Math.floor(mpState.countdown);
    const cdText = cdNum >= 1 ? String(cdNum) : "GO!";
    roundRect(W / 2 - 160, H / 2 - 110, 320, 130, 14, "rgba(10,15,25,0.92)", "#ffca28", 2.5);
    ctx.fillStyle = cdNum >= 1 ? "#ffd03b" : "#2df06e";
    ctx.font = "900 58px Arial"; ctx.textAlign = "center";
    ctx.fillText(cdText, W / 2, H / 2 - 32);
  }
}

async function submitLoginOrRegister(isRegister) {
  loginState.registerMode = isRegister;
  const u = loginState.username.trim();
  const p = loginState.password;
  if (u.length < 2) {
    loginState.statusMsg = "Driver Callsign must be at least 2 characters.";
    loginState.isError = true;
    return;
  }
  if (p.length < 4) {
    loginState.statusMsg = "Security Passkey must be at least 4 characters.";
    loginState.isError = true;
    return;
  }
  try {
    const endpoint = isRegister ? '/api/register' : '/api/login';
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      loginState.statusMsg = data.error || "Authentication failed.";
      loginState.isError = true;
      playTone(180, 0.18, 'sawtooth', 0.12);
      return;
    }
    profile.isLoggedIn = true;
    profile.username = data.username;
    profile.password = p;
    profile.coins = data.coins ?? 500;
    profile.ownedCars = data.ownedCars || 1;
    profile.ownedEngines = data.ownedEngines || 1;
    profile.selectedCar = data.selectedCar || 0;
    profile.selectedEngine = data.selectedEngine || 0;
    profile.wins = data.wins || 0;
    profile.podiums = data.podiums || 0;
    profile.races = data.races || 0;

    menuState.previewCar = profile.selectedCar;
    menuState.previewEngine = profile.selectedEngine;
    applyCarAndEngineSpecs();

    loginState.showModal = false;
    loginState.password = "";
    loginState.statusMsg = "";
    menuState.bannerText = `WELCOME, ${profile.username.toUpperCase()}!  •  ${profile.coins} COINS IN VAULT  •  ${profile.wins} CAREER WINS`;
    menuState.bannerError = false;
    menuState.bannerTimer = 5.0;
    fetchSavedUsers();
    playTone(660, 0.15, 'triangle', 0.14);
  } catch (e) {
    loginState.statusMsg = "Network error communicating with server.";
    loginState.isError = true;
  }
}

function handleCarClick(carIdx) {
  menuState.previewCar = carIdx;
  const cs = CARS[carIdx];
  if (ownsCar(carIdx)) {
    profile.selectedCar = carIdx;
    applyCarAndEngineSpecs();
    syncProfileToServer();
    if (mpState.connected) sendWs({ type: "WS_CAR_SYNC", id: mpState.myPeerId, car: carIdx });
    menuState.bannerText = `CHASSIS EQUIPPED: ${cs.name}  —  ${cs.feature}`;
    menuState.bannerError = false;
    menuState.bannerTimer = 4.0;
    playTone(540, 0.08, 'sine', 0.1);
  } else if (profile.coins >= cs.price) {
    profile.coins -= cs.price;
    profile.ownedCars |= (1 << carIdx);
    profile.selectedCar = carIdx;
    applyCarAndEngineSpecs();
    syncProfileToServer();
    menuState.bannerText = `UNLOCKED & EQUIPPED: ${cs.name} (-${cs.price} COINS)!  ${cs.feature}`;
    menuState.bannerError = false;
    menuState.bannerTimer = 5.0;
    playTone(784, 0.18, 'triangle', 0.15);
  } else {
    const need = cs.price - profile.coins;
    menuState.bannerText = `LOCKED SUPERCAR: ${cs.name} REQUIRES ${cs.price} COINS (NEED ${need} MORE COINS — RACE TO EARN!)`;
    menuState.bannerError = true;
    menuState.bannerTimer = 4.5;
    playTone(200, 0.14, 'sawtooth', 0.1);
  }
}

  const colGap = 12;

    const bW = Math.round(bw * Math.max(0.05, Math.min(1, baseF)));
    const tW = Math.round(bw * Math.max(0.05, Math.min(1, totF)));

  const barY = specY + 38;
  drawDynoBar(barY, "TOP SPEED", `${Math.round(combSpeed)} KM/H (+${eSpec.topBonus})`, (cSpec.maxSpeed - 180) / 60, (combSpeed - 180) / 60, "#00e1ff");
  drawDynoBar(barY + 28, "ACCELERATION", `${Math.round(combAccel)} RATING (${eSpec.hp} HP)`, (cSpec.accel - 75) / 65, (combAccel - 75) / 65, "#ffc32d");
  drawDynoBar(barY + 56, "CORNERING GRIP", `${Math.round(combGrip * 100)}%`, cSpec.grip / 1.4, combGrip / 1.4, "#af7dff");
  drawDynoBar(barY + 84, "ARMOR DURABILITY", `${Math.round(combArmor * 100)}%`, cSpec.armor / 1.65, combArmor / 1.65, "#32eb8c");

  // RIGHT COLUMN: 5 ENGINE POWERTRAINS
  const rightX = centerX + centerW + colGap;
  ctx.textAlign = "left"; ctx.fillStyle = "#ffcd37"; ctx.font = "900 10px Arial";
  ctx.fillText("02  •  ENGINE POWERTRAINS (5 BLOCKS)", rightX, curY + 15);
  uiRects.garageEngineCards = [];

  for (let i = 0; i < 3; i++) {
    const r = { x: contentX + i * 80, y: 136, w: 74, h: 38 };
    uiRects.todBtns.push(r);
    const act = (menuState.tod === i);
    roundRect(r.x, r.y, r.w, r.h, 5, act ? todCols[i] : "#0e131c", act ? "#fff" : "#283446", 1.2);
    ctx.fillStyle = "#fff"; ctx.font = "bold 9px Arial"; ctx.textAlign = "center";
    ctx.fillText(todLabels[i], r.x + 37, r.y + 23);
  }

  uiRects.openGarageQuick = { x: contentX + contentW - 180, y: 136, w: 180, h: 38 };
  roundRect(uiRects.openGarageQuick.x, 136, 180, 38, 5, "rgba(52,40,12,0.94)", "#ffd23c", 1.5);
  ctx.fillStyle = "#ffe150"; ctx.font = "900 9px Arial"; ctx.textAlign = "center";
  ctx.fillText("⚙ TUNE ENGINE & GARAGE", uiRects.openGarageQuick.x + 90, 151);
  ctx.fillStyle = "#b9e1ff"; ctx.font = "bold 8px Arial";
  ctx.fillText(`${player.engineModelName} (${player.hp} HP)`, uiRects.openGarageQuick.x + 90, 166);

  uiRects.quickCars = [];
  const carStartX = contentX + 248;
  const remW = uiRects.openGarageQuick.x - 12 - carStartX;
  const carBtnW = Math.floor((remW - 24) / 4);
  for (let i = 0; i < 4; i++) {
    const cIdx = CAR_DISPLAY_ORDER[i];
    const cs = CARS[cIdx];
    const owned = ownsCar(cIdx);
    const sel = (profile.selectedCar === cIdx);
    const r = { x: carStartX + i * (carBtnW + 8), y: 136, w: carBtnW, h: 38 };
    uiRects.quickCars.push({ rect: r, idx: cIdx });
    roundRect(r.x, r.y, r.w, r.h, 5, sel ? "#141e2e" : "#0d121c", sel ? cs.accent : "#283446", sel ? 1.8 : 1);
    draw3DSupercar(r.x + 24, r.y + 34, 34, 22, cIdx, true, 0, 0, false);
    ctx.textAlign = "left"; ctx.fillStyle = sel ? cs.accent : (owned ? "#fff" : "#ffd241"); ctx.font = "bold 9px Arial";
    ctx.fillText(cs.name, r.x + 46, r.y + 16);
    ctx.fillStyle = owned ? "#91aac3" : "#ffc337"; ctx.font = "bold 8px Arial";
    ctx.fillText(owned ? `${cs.maxSpeed + ENGINES[profile.selectedEngine].topBonus} KM/H • OWNED` : `🔒 UNLOCK: ${cs.price} 🪙`, r.x + 46, r.y + 30);
  }

  // Row 3: 4 Grand Prix Circuit Cards
  uiRects.trackCards = [];
  const cGap = 14, cW = Math.floor((contentW - 3 * cGap) / 4), cH = 312, cY = 182;
  const p1Purse = Math.round(500 * DIFFICULTIES[menuState.difficulty].mult);
  for (let i = 0; i < 4; i++) {
    const c = CIRCUITS[i];
    const cx = contentX + i * (cW + cGap);
    const r = { x: cx, y: cY, w: cW, h: cH };
    uiRects.trackCards.push(r);
    const sel = (menuState.theme === i);
    roundRect(cx, cY, cW, cH, 7, sel ? "rgba(20,29,44,0.96)" : "rgba(12,17,26,0.92)", sel ? c.accent : "#263244", sel ? 2.2 : 1);

    // Thumbnail sky preview
    const tg = ctx.createLinearGradient(cx + 6, cY + 6, cx + 6, cY + 110);
    tg.addColorStop(0, c.skyTop); tg.addColorStop(0.6, c.skyMid); tg.addColorStop(1, c.skyBot);
    roundRect(cx + 6, cY + 6, cW - 12, 104, 4, tg, sel ? c.accent : "#000", 1);

    roundRect(cx + 12, cY + 12, 88, 18, 3, "rgba(8,12,20,0.88)", c.accent, 1);
    ctx.fillStyle = c.accent; ctx.font = "bold 8px Arial"; ctx.textAlign = "center";
    ctx.fillText(c.tag, cx + 56, cY + 24);

    roundRect(cx + cW - 102, cY + 12, 90, 18, 3, "rgba(28,22,6,0.9)", "#ffcd37", 1);
    ctx.fillStyle = "#ffe14b"; ctx.font = "bold 8px Arial";
    ctx.fillText(`1ST: +${p1Purse} 🪙`, cx + cW - 57, cY + 24);

    ctx.textAlign = "left"; ctx.fillStyle = "#fff"; ctx.font = "bold 15px Arial";
    ctx.fillText(c.title, cx + 12, cY + 134);
    ctx.fillStyle = "#96aac3"; ctx.font = "10px Arial";
    ctx.fillText(c.subtitle, cx + 12, cY + 152);

    const drawDots = (ry, lbl, val, col) => {
      ctx.fillStyle = "#879bb4"; ctx.font = "bold 9px Arial"; ctx.textAlign = "left";
      ctx.fillText(lbl, cx + 12, ry + 8);
      for (let s = 0; s < 5; s++) {
        roundRect(cx + cW - 82 + s * 14, ry, 11, 7, 1, s < val ? col : "#1a222e", null);
      }
    };
    drawDots(cY + 174, "ELEVATION", c.hills, "#00d7ff");
    drawDots(cY + 194, "TRAFFIC", c.traffic, "#ffb928");
    drawDots(cY + 214, "CHALLENGE", c.diff, c.accent);

    roundRect(cx + 12, cY + cH - 40, cW - 24, 30, 5, sel ? c.accent : "#161e2c", sel ? "#fff" : "#303e52", 1.2);
    ctx.fillStyle = sel ? "#080c12" : "#fff"; ctx.font = "bold 10px Arial"; ctx.textAlign = "center";
    ctx.fillText(sel ? "SELECTED CIRCUIT  •  RACE ▶" : "SELECT CIRCUIT", cx + cW / 2, cY + cH - 21);
  }

  // Row 4: Command Dock
  const actY = cY + cH + 12;
  uiRects.startRaceBtn = { x: W / 2 - 384, y: actY, w: 310, h: 40 };
  uiRects.resetRaceBtn = { x: W / 2 - 60, y: actY, w: 215, h: 40 };
  uiRects.lightsBtn = { x: W / 2 + 169, y: actY, w: 215, h: 40 };

  roundRect(uiRects.startRaceBtn.x, actY, 310, 40, 6, "#00d778", "#82ffc3", 1.8);
  ctx.fillStyle = "#06120a"; ctx.font = "900 13px Arial"; ctx.textAlign = "center";
  ctx.fillText(player.speed > 1 ? "▶  RESUME RACE  [ESC]" : "▶  START RACE  [ENTER / CLICK]", uiRects.startRaceBtn.x + 155, actY + 25);

  roundRect(uiRects.resetRaceBtn.x, actY, 215, 40, 6, "#1a2434", "#ffa532", 1.2);
  ctx.fillStyle = "#ffc869"; ctx.font = "bold 10px Arial";
  ctx.fillText("FRESH GRID START  [KEY R]", uiRects.resetRaceBtn.x + 107, actY + 24);

  roundRect(uiRects.lightsBtn.x, actY, 215, 40, 6, "#162234", "#00d2ff", 1.2);
  ctx.fillStyle = "#a5e6ff"; ctx.font = "bold 10px Arial";
  ctx.fillText("TIME OF DAY  [KEY N]", uiRects.lightsBtn.x + 107, actY + 24);

  ctx.fillStyle = "#879bb6"; ctx.font = "bold 9px Arial";
  ctx.fillText("CONTROLS:  [W/S or UP/DOWN] THROTTLE & BRAKE  •  [A/D or LEFT/RIGHT] STEER  •  [C] CAMERA VIEW  •  [F1-F4] SUPERCAR  •  [M/ESC] MENU", W / 2, H - 10);
}

// ============================================================================
//  12. INPUT EVENTS & 60 FPS MAIN LOOP
// ============================================================================
canvas.addEventListener('mousedown', (e) => {
  updateMousePos(e);

  if (menuState.showMenu && !menuState.isTransitioning) {
    if (loginState.showModal || !profile.isLoggedIn) {
      if (hitRect(uiRects.loginSignInTab)) { loginState.registerMode = false; loginState.statusMsg = ""; return; }
      if (hitRect(uiRects.loginRegTab)) { loginState.registerMode = true; loginState.statusMsg = ""; return; }
      if (hitRect(uiRects.loginUserBox)) {
        loginState.focusField = 0;
        const v = prompt("Enter Driver Callsign:", loginState.username);
        if (v !== null) { loginState.username = v.trim(); loginState.focusField = 1; }
        return;
      }
      if (hitRect(uiRects.loginPassBox)) {
        loginState.focusField = 1;
        const v = prompt("Enter Security Passkey (min 4 chars):", loginState.password);
        if (v !== null) loginState.password = v;
        return;
      }
      if (hitRect(uiRects.loginShowPass)) { loginState.showPass = !loginState.showPass; return; }
      if (hitRect(uiRects.loginSubmitBtn)) { submitLoginOrRegister(false); return; }
      if (hitRect(uiRects.registerDirectBtn)) { submitLoginOrRegister(true); return; }
      if (profile.isLoggedIn && hitRect(uiRects.loginCloseBtn)) { loginState.showModal = false; return; }
      for (const chip of uiRects.savedUserChips) {
        if (hitRect(chip.rect)) {
          loginState.username = chip.name;
          loginState.password = "";
          loginState.registerMode = false;
          loginState.focusField = 1;
          loginState.statusMsg = `Selected driver '${chip.name}'. Enter passkey to sign in.`;
          loginState.isError = false;
          return;
        }
      }
      return;
    }

    if (hitRect(uiRects.accountBadge)) {
      loginState.showModal = true;
      loginState.password = "";
      loginState.statusMsg = `Currently signed in as '${profile.username}'. Switch profile or register a new driver.`;
      loginState.isError = false;
      return;
    }
    if (hitRect(uiRects.soloTab)) { menuState.tab = 0; return; }
    if (hitRect(uiRects.garageTab)) {
      menuState.tab = 1;
      menuState.previewCar = profile.selectedCar;
      menuState.previewEngine = profile.selectedEngine;
      return;
    }
    if (hitRect(uiRects.mpTab)) { menuState.tab = 2; ensureWebSocket(); return; }

    if (menuState.tab === 1) {
      for (const c of uiRects.garageCarCards) if (hitRect(c.rect)) { handleCarClick(c.idx); return; }
      for (const eg of uiRects.garageEngineCards) if (hitRect(eg.rect)) { handleEngineClick(eg.idx); return; }
      if (hitRect(uiRects.startRaceBtn)) { startTransitionToRace(false); return; }
      if (hitRect(uiRects.resetRaceBtn)) { menuState.tab = 0; return; }
      return;
    }

    if (menuState.tab === 2) {
      if (!mpState.connected) {
        if (hitRect(uiRects.mpHostRoomBox)) {
          const v = prompt("Enter Room ID to Host:", mpState.roomId);
          if (v && v.trim()) mpState.roomId = v.trim().toUpperCase();
          return;
        }
        if (hitRect(uiRects.mpHostRandBtn)) {
          const pfx = ["APEX", "TURBO", "VORTEX", "DRIFT", "NITRO", "HYPER"][Math.floor(Math.random() * 6)];
          mpState.roomId = `${pfx}-${Math.floor(100 + Math.random() * 900)}`;
          return;
        }
        if (hitRect(uiRects.mpHostPassBox)) {
          const v = prompt("Enter Room Passkey (leave blank for open lobby):", mpState.password);
          if (v !== null) mpState.password = v.trim();
          return;
        }
        if (hitRect(uiRects.mpCreateBtn)) {
          sendWs({
            type: "WS_HOST_ROOM",
            roomId: mpState.roomId,
            password: mpState.password,
            name: profile.username || "HostDriver",
            car: profile.selectedCar,
            theme: menuState.theme,
            tod: menuState.tod
          });
          return;
        }
        if (hitRect(uiRects.mpJoinRoomBox)) {
          const v = prompt("Enter Room ID to Join:", mpState.joinRoomId);
          if (v && v.trim()) mpState.joinRoomId = v.trim().toUpperCase();
          return;
        }
        if (hitRect(uiRects.mpJoinPassBox)) {
          const v = prompt("Enter Room Passkey:", mpState.joinPassword);
          if (v !== null) mpState.joinPassword = v.trim();
          return;
        }
        for (const ch of uiRects.mpRoomChips) {
          if (hitRect(ch.rect)) { mpState.joinRoomId = ch.roomId; return; }
        }
        if (hitRect(uiRects.mpJoinBtn)) {
          sendWs({
            type: "WS_JOIN_ROOM",
            roomId: mpState.joinRoomId,
            password: mpState.joinPassword,
            name: profile.username || "Driver",
            car: profile.selectedCar
          });
          return;
        }
      } else {
        if (hitRect(uiRects.mpReadyBtn)) {
          mpState.ready = !mpState.ready;
          sendWs({ type: "WS_READY", id: mpState.myPeerId, ready: mpState.ready });
          return;
        }
        if (hitRect(uiRects.mpStartBtn) && mpState.isHost) {
          sendWs({ type: "WS_START_RACE", duration: 3.5, theme: menuState.theme, tod: menuState.tod });
          return;
        }
        if (hitRect(uiRects.mpLeaveBtn)) {
          sendWs({ type: "WS_LEAVE_ROOM" });
          mpState.connected = false;
          mpState.peers = {};
          return;
        }
      }
      return;
    }

    // Tab 0 clicks
    for (let i = 0; i < uiRects.diffBtns.length; i++) {
      if (hitRect(uiRects.diffBtns[i])) { menuState.difficulty = i; resetRace(); return; }
    }
    for (let i = 0; i < uiRects.todBtns.length; i++) {
      if (hitRect(uiRects.todBtns[i])) { menuState.tod = i; return; }
    }
    if (hitRect(uiRects.openGarageQuick)) {
      menuState.tab = 1;
      menuState.previewCar = profile.selectedCar;
      menuState.previewEngine = profile.selectedEngine;
      return;
    }
    for (const qc of uiRects.quickCars) {
      if (hitRect(qc.rect)) { handleCarClick(qc.idx); return; }
    }
    for (let i = 0; i < uiRects.trackCards.length; i++) {
      if (hitRect(uiRects.trackCards[i])) {
        menuState.theme = i;
        resetRace();
        startTransitionToRace(false);
        return;
      }
    }
    if (hitRect(uiRects.startRaceBtn)) { startTransitionToRace(false); return; }
    if (hitRect(uiRects.resetRaceBtn)) { startTransitionToRace(true); return; }
    if (hitRect(uiRects.lightsBtn)) { menuState.tod = (menuState.tod + 1) % 3; return; }
    return;
  }

  // In-game HUD clicks
  if (mouseX >= 292 && mouseX <= 440 && mouseY >= 6 && mouseY <= 28) {
    player.thirdPersonView = !player.thirdPersonView;
    return;
  }
  const startX = W / 2 - (4 * 132 + 3 * 8) / 2;
  if (mouseY >= 56 && mouseY <= 78) {
    for (let i = 0; i < 4; i++) {
      const rx = startX + i * 140;
      if (mouseX >= rx && mouseX <= rx + 132) {
        if (i === 0) player.zBuffer3DMode = !player.zBuffer3DMode;
        if (i === 1) player.adasEnabled = !player.adasEnabled;
        if (i === 2) player.arGuidesEnabled = !player.arGuidesEnabled;
        if (i === 3) player.pixelSize = (player.pixelSize === 1) ? 2 : (player.pixelSize === 2 ? 4 : 1);
        return;
      }
    }
  }
  if (player.raceFinished) {
    resetRace();
  }
});

window.addEventListener('keydown', (e) => {
  if (menuState.showMenu && (loginState.showModal || !profile.isLoggedIn)) {
    if (e.key === 'Tab' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      loginState.focusField = (loginState.focusField === 0) ? 1 : 0;
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      submitLoginOrRegister(loginState.registerMode);
      return;
    }
    if (e.key === 'Escape' && profile.isLoggedIn) {
      loginState.showModal = false;
      return;
    }
    if (e.key === 'Backspace') {
      if (loginState.focusField === 0) loginState.username = loginState.username.slice(0, -1);
      else loginState.password = loginState.password.slice(0, -1);
      return;
    }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      if (loginState.focusField === 0 && loginState.username.length < 22) loginState.username += e.key;
      else if (loginState.focusField === 1 && loginState.password.length < 28) loginState.password += e.key;
    }
    return;
  }

  const k = e.key.toLowerCase();
  if (k === 'w' || e.key === 'ArrowUp') keys.up = true;
  if (k === 's' || e.key === 'ArrowDown') keys.down = true;
  if (k === 'a' || e.key === 'ArrowLeft') keys.left = true;
  if (k === 'd' || e.key === 'ArrowRight') keys.right = true;
  if (e.key === ' ') keys.space = true;
  if (k === 'c' || k === 'v') player.thirdPersonView = !player.thirdPersonView;
  if (k === 'n') menuState.tod = (menuState.tod + 1) % 3;
  if (k === '1' || k === 'z') player.zBuffer3DMode = !player.zBuffer3DMode;
  if (k === '2' || k === 'g') player.adasEnabled = !player.adasEnabled;
  if (k === '3' || k === 'f') player.arGuidesEnabled = !player.arGuidesEnabled;
  if (k === '4' || k === 'j') player.pixelSize = (player.pixelSize === 1) ? 2 : (player.pixelSize === 2 ? 4 : 1);
  if (k === 'y') player.health = 100;
  if (k === 'r') resetRace();
  if (k === 'o') { menuState.tab = 2; menuState.showMenu = true; menuState.isTransitioning = false; }
  if (e.key === 'F1') { e.preventDefault(); handleCarClick(0); }
  if (e.key === 'F2') { e.preventDefault(); handleCarClick(1); }
  if (e.key === 'F3') { e.preventDefault(); handleCarClick(2); }
  if (e.key === 'F4') { e.preventDefault(); handleCarClick(3); }
  if (e.key === 'Enter' && menuState.showMenu && !menuState.isTransitioning) {
    startTransitionToRace(false);
  }
  if (k === 'm' || e.key === 'Escape') {
    if (menuState.showMenu && !menuState.isTransitioning) startTransitionToRace(false);
    else { menuState.showMenu = true; menuState.isTransitioning = false; }
  }
});

window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'w' || e.key === 'ArrowUp') keys.up = false;
  if (k === 's' || e.key === 'ArrowDown') keys.down = false;
  if (k === 'a' || e.key === 'ArrowLeft') keys.left = false;
  if (k === 'd' || e.key === 'ArrowRight') keys.right = false;
  if (e.key === ' ') keys.space = false;
});

// Initialize & Start 60 FPS Loop
resetRace();
fetchSavedUsers();
let lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min(0.05, Math.max(0.004, (now - lastTime) / 1000));
  lastTime = now;
  menuState.animTime += dt;
  if (menuState.bannerTimer > 0) menuState.bannerTimer -= dt;
  if (mpState.errorTimer > 0) mpState.errorTimer -= dt;

  if (menuState.isTransitioning) {
    menuState.menuOpacity -= dt * 1.85;
    if (menuState.menuOpacity <= 0) {
      menuState.menuOpacity = 0;
      menuState.isTransitioning = false;
      menuState.showMenu = false;
    }
  } else if (menuState.showMenu) {
    menuState.menuOpacity = Math.min(1, menuState.menuOpacity + dt * 4.5);
  } else {
    menuState.menuOpacity = Math.max(0, menuState.menuOpacity - dt * 4.5);
  }
  if (menuState.transitionFlash > 0) {
    menuState.transitionFlash = Math.max(0, menuState.transitionFlash - dt * 1.35);
  }

  if (!menuState.showMenu || menuState.isTransitioning) {
    updatePhysics(dt);
  }

  // Render at native HiDPI resolution with crisp aspect-ratio preservation
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#04070e";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.setTransform(viewScale * viewDpr, 0, 0, viewScale * viewDpr, viewOffX * viewDpr, viewOffY * viewDpr);
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();

  renderWorldAndHUD();

  if (menuState.showMenu || menuState.menuOpacity > 0.01) {
    ctx.save();
    ctx.globalAlpha = menuState.menuOpacity;
    renderMainMenuOverlay();
    ctx.restore();
  }

  if (menuState.transitionFlash > 0.01) {
    const bell = Math.sin(menuState.transitionFlash * Math.PI);
    ctx.fillStyle = `rgba(0,225,255,${(0.22 * bell).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
